<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labs-Squared</title>
  <meta name="description" content="Labs-Squared — Something Great is Coming.">
  <meta name="theme-color" content="#040a18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page">
    <div class="stage-media" data-media-state="poster" aria-hidden="true">
      <div class="stage-media-frame">
        <div class="stage-poster"></div>
        <video
          class="stage-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          poster="assets/shapes-poster.webp"
          disablepictureinpicture
          disableremoteplayback
          tabindex="-1"
          aria-hidden="true"
        >
          <source src="assets/shapes-loop.webm" type="video/webm">
        </video>
      </div>
    </div>

    <header class="site-header">
      <p class="brand">Labs-Squared</p>
    </header>

    <main class="hero">
      <h1 class="hero-heading">Something Great is Coming.</h1>

      <nav class="hero-actions" aria-label="Labs-Squared links">
        <a class="action-button" href="https://www.rabslabs.xyz">Rabs Labs</a>
        <a class="action-button" href="https://www.labscamover9.com">Labscamover9</a>
      </nav>
    </main>
  </div>
</body>
</html>
